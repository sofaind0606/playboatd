<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Найди пару — настройки</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="settings-screen" class="screen">
    <h2>Настройки</h2>
    <label><input type="radio" name="size" value="4" checked> Поле 4×4 (8 пар)</label>
    <label><input type="radio" name="size" value="8"> Поле 2×4 (4 пары)</label>
    <button id="btn-back">Назад</button>
  </div>

  <div id="offline-screen" class="screen hidden">
    <h2>Нет подключения к интернету</h2>
    <p class="offline-dot">●</p>
    <p>Проверьте подключение и обновите страницу</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
