<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Найди пару — игра</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-screen" class="screen">
    <div id="stats">Ходов: <span id="moves">0</span></div>
    <div id="board"></div>
    <button id="btn-restart">Заново</button>
    <button id="btn-game-back">Назад</button>
  </div>

  <div id="offline-screen" class="screen hidden">
    <h2>Нет подключения к интернету</h2>
    <p class="offline-dot">●</p>
    <p>Проверьте подключение и обновите страницу</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
