<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Найди пару — победа</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="win-screen" class="screen">
    <h2>Победа!</h2>
    <p>Ходов: <span id="final-moves">0</span></p>
    <button id="btn-play-again">Играть снова</button>
    <button id="btn-win-back">Назад</button>
  </div>

  <div id="offline-screen" class="screen hidden">
    <h2>Нет подключения к интернету</h2>
    <p class="offline-dot">●</p>
    <p>Проверьте подключение и обновите страницу</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
